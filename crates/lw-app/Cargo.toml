[package]
name = "lw-app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Application logic shared by every OwlWhisp front end: settings state, the model catalog as it is shown, install and benchmark orchestration, and the numbers this machine has measured. Knows nothing about Tauri, egui or any other UI toolkit."

[features]
default = []
# Mirrors the engine feature the binaries turn on, so this crate builds the same engines.
sherpa = ["lw-engine-sherpa/sherpa"]

[dependencies]
lw-core.workspace = true
lw-ort.workspace = true
lw-platform.workspace = true
lw-engine-parakeet.workspace = true
lw-engine-sherpa.workspace = true

crossbeam-channel.workspace = true
# The model downloader is async; the install thread runs it on a current-thread runtime.
tokio = { workspace = true, features = ["rt"] }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true
tracing-appender.workspace = true
tracing-subscriber.workspace = true
