[package]
name = "lw-platform"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "OS integration for LocalWisper: audio capture, global hotkeys, text injection, clipboard, foreground app, hardware capabilities (Windows, macOS, Linux)"

[dependencies]
lw-core.workspace = true
cpal.workspace = true
arboard.workspace = true
thiserror.workspace = true
anyhow.workspace = true
tracing.workspace = true
parking_lot.workspace = true
crossbeam-channel.workspace = true
keyring.workspace = true
directories.workspace = true
serde.workspace = true
sysinfo.workspace = true

[target.'cfg(windows)'.dependencies]
windows = { workspace = true, features = [
  "Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Shell",
  "Win32_System_DataExchange", "Win32_System_Memory", "Win32_System_Threading", "Win32_System_LibraryLoader",
  "Win32_System_Registry", "Win32_System_SystemInformation", "Win32_Storage_FileSystem", "Win32_Graphics_Gdi",
  "Win32_Devices_DeviceAndDriverInstallation", "Win32_Devices_Properties", "Win32_System_Com", "Win32_System_Ole",
  "Win32_UI_Accessibility", "Win32_System_ProcessStatus", "Win32_Security", "Win32_System_Diagnostics_Debug",
] }
windows-sys = { workspace = true, features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse"] }

[dev-dependencies]
hound.workspace = true

