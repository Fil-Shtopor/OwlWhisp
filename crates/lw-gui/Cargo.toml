[package]
name = "lw-gui"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "The LocalWisper desktop window, drawn natively on the CPU. Replaces the Tauri/WebView2 front end: one process instead of eight, no browser engine, no GPU context, and the same pixels on every platform because nothing platform-specific draws them."

[[bin]]
name = "localwisper-gui"
path = "src/main.rs"

[features]
default = []
sherpa = ["lw-app/sherpa"]

[dependencies]
lw-app.workspace = true
lw-core.workspace = true
lw-platform.workspace = true

iced = { workspace = true }
# For `spawn_blocking`: the benchmark sweep must not run on the thread that draws.
tokio = { workspace = true, features = ["rt"] }

serde.workspace = true
serde_json.workspace = true
