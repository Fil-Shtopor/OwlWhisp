name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test-windows-arm64:
    runs-on: windows-11-arm
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust (aarch64-pc-windows-msvc)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-pc-windows-msvc
          components: rustfmt, clippy
      - name: Format check
        run: cargo fmt --all --check
      - name: Clippy (core crates)
        run: cargo clippy -p lw-core -p lw-ort -p lw-vad-silero -p lw-engine-parakeet -p lw-engine-whisper -p lw-platform -p lw-cli -- -D warnings
      - name: Unit tests
        run: cargo test --workspace --exclude localwisper
      # NPU/model integration tests are gated behind --ignored and need a self-hosted X2 runner
      # with the model + runtime present (set LW_MODEL_DIR / LW_RUNTIME_DIR there).

  build-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Build frontend
        working-directory: app/frontend
        run: |
          npm ci || npm install
          npm run build
