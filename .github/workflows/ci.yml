name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: python -m unittest discover -s tests -p test_release_packaging.py
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings

  test-windows-arm64:
    runs-on: windows-11-arm
    steps:
      - uses: actions/checkout@v5
      - name: Install Rust (aarch64-pc-windows-msvc)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-pc-windows-msvc
      - uses: Swatinem/rust-cache@v2
      - name: Tests (including all simulated hardware configurations)
        run: cargo test --locked --workspace
      # NPU/model integration tests are gated behind --ignored and need a self-hosted X2 runner
      # with the model + runtime present (set LW_MODEL_DIR / LW_RUNTIME_DIR there).

  # Build and test on native hosts. hardware_matrix also exercises all six OS/architecture
  # combinations on every runner without native provider libraries, GPUs or downloaded models.
  cross-compile:
    name: test ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: windows-x64, runner: windows-latest, target: x86_64-pc-windows-msvc }
          - { name: macos-arm64, runner: macos-15, target: aarch64-apple-darwin }
          - { name: macos-x64, runner: macos-15-intel, target: x86_64-apple-darwin }
          - { name: linux-x64, runner: ubuntu-22.04, target: x86_64-unknown-linux-gnu }
          - { name: linux-arm64, runner: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu }
    env:
      CARGO_BUILD_JOBS: 3
      MACOSX_DEPLOYMENT_TARGET: "13.3"
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci-${{ matrix.target }}
      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libxdo-dev libxkbcommon-dev \
                                  libwayland-dev libxcb1-dev libgtk-3-dev libayatana-appindicator3-dev
      - name: Check workspace
        run: cargo check --locked --workspace --target ${{ matrix.target }}
      - name: Tests (including all simulated hardware configurations)
        run: cargo test --locked --workspace --target ${{ matrix.target }}

