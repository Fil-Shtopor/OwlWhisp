name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-arm64
            runner: windows-11-arm
            target: aarch64-pc-windows-msvc
            platform: win-arm64
            package: windows
          - name: windows-x64
            runner: windows-latest
            target: x86_64-pc-windows-msvc
            platform: win-x64
            package: windows
          - name: macos-arm64
            runner: macos-14
            target: aarch64-apple-darwin
            platform: osx-arm64
            package: unix
          - name: macos-x64
            runner: macos-13
            target: x86_64-apple-darwin
            platform: osx-x64
            package: unix
          - name: linux-x64
            runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            platform: linux-x64
            package: unix
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang libasound2-dev libxdo-dev \
            libxkbcommon-dev libwayland-dev libxcb1-dev libgtk-3-dev
      - name: Install NSIS
        if: runner.os == 'Windows'
        shell: pwsh
        run: choco install nsis --no-progress -y
      - name: Install LLVM for Windows ARM64 dependencies
        if: runner.os == 'Windows'
        shell: pwsh
        run: choco install llvm --no-progress -y
      - name: Stage ONNX Runtime
        shell: pwsh
        run: pwsh -File scripts/runtime/fetch-runtime.ps1 -Platform ${{ matrix.platform }}
      - name: Stage GPL-free sherpa-onnx libraries
        shell: pwsh
        run: |
          $dir = pwsh -File scripts/build/fetch-sherpa.ps1 -Platform ${{ matrix.platform }} -Quiet
          if (-not $dir -or -not (Test-Path $dir)) { throw "fetch-sherpa.ps1 produced no library directory" }
          "SHERPA_ONNX_LIB_DIR=$dir" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
      - name: Build OwlWhisp
        run: cargo build -p lw-gui --release --target ${{ matrix.target }} --features sherpa
      - name: Package Windows application
        if: matrix.package == 'windows'
        shell: pwsh
        run: pwsh -File scripts/build/package-windows.ps1 -Target ${{ matrix.target }} -Platform ${{ matrix.platform }}
      - name: Package macOS or Linux application
        if: matrix.package == 'unix'
        shell: pwsh
        run: pwsh -File scripts/build/package-unix.ps1 -Target ${{ matrix.target }} -Platform ${{ matrix.platform }}
      - name: Verify package does not contain Qualcomm files where prohibited
        if: matrix.platform != 'win-arm64'
        shell: pwsh
        run: |
          $hits = Get-ChildItem -Recurse dist -Include "Qnn*","libQnn*","*QnnHtp*" -ErrorAction SilentlyContinue
          if ($hits) { $hits | ForEach-Object { Write-Error $_.FullName }; exit 1 }
      - name: Create checksums
        shell: pwsh
        run: |
          Get-ChildItem dist -File | ForEach-Object {
            (Get-FileHash $_.FullName -Algorithm SHA256).Hash + "  " + $_.Name
          } | Set-Content "dist/SHA256SUMS-${{ matrix.name }}.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: owlwhisp-${{ matrix.name }}
          path: |
            dist/*.zip
            dist/*.tar.gz
            dist/*-setup.exe
            dist/SHA256SUMS-*.txt
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - name: Publish release assets
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: release-assets/*
