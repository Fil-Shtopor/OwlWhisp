[workspace]
resolver = "2"
members = [
    "crates/lw-core",
    "crates/lw-ort",
    "crates/lw-vad-silero",
    "crates/lw-engine-parakeet",
    "crates/lw-engine-whisper",
    "crates/lw-engine-sherpa",
    "crates/lw-platform",
    "crates/lw-cli",
    "app/src-tauri",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "Apache-2.0"
repository = "https://github.com/localwisper/localwisper"
authors = ["LocalWisper contributors"]

[workspace.dependencies]
# internal
lw-core = { path = "crates/lw-core" }
lw-ort = { path = "crates/lw-ort" }
lw-vad-silero = { path = "crates/lw-vad-silero" }
lw-engine-parakeet = { path = "crates/lw-engine-parakeet" }
lw-engine-whisper = { path = "crates/lw-engine-whisper" }
lw-engine-sherpa = { path = "crates/lw-engine-sherpa" }
lw-platform = { path = "crates/lw-platform" }

# serialization / config
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "1.1"
schemars = "1.0"

# errors / logging
thiserror = "2.0"
anyhow = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
tracing-appender = "0.2"

# async / concurrency
tokio = { version = "1.53", features = ["rt-multi-thread", "sync", "time", "macros", "fs", "io-util"] }
parking_lot = "0.12"
crossbeam-channel = "0.5"
futures = "0.3"
tokio-util = { version = "0.7", features = ["rt"] }

# audio
cpal = "0.18"
rubato = "0.16"
hound = "3.5"
realfft = "3.5"
rustfft = "6.4"

# ML runtime
ort = { version = "=2.0.0-rc.13", default-features = false }
ort-sys = { version = "=2.0.0-rc.13", default-features = false }
ndarray = "0.17"
half = "2.7"
# sherpa-onnx bundles its OWN ONNX Runtime. Keep the `static` feature (the crate default) so it is
# linked into the binary instead of shipping a second `onnxruntime.dll` that would collide with the
# one `lw-ort` loads dynamically by full path. See crates/lw-engine-sherpa/README.md.
sherpa-onnx = { version = "1.13.6", default-features = false, features = ["static"] }

# networking / hashing / files
reqwest = { version = "0.12", default-features = false, features = ["default-tls", "stream", "json", "charset", "http2", "blocking"] }
sha2 = "0.11"
hex = "0.4"
directories = "6.0"
tempfile = "3"
walkdir = "2"
zip = { version = "8.6", default-features = false, features = ["deflate"] }
tar = "0.4"
bzip2 = "0.6"
flate2 = "1.1"

# misc
regex = "1.13"
unicode-normalization = "0.1"
semver = { version = "1.0", features = ["serde"] }
uuid = { version = "1.25", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
once_cell = "1"
sysinfo = "0.39"
keyring = { version = "4.1", features = ["windows-native-keyring-store", "apple-native-keyring-store", "linux-keyutils-keyring-store"] }
clap = { version = "4.6", features = ["derive"] }
indicatif = "0.18"
libloading = "0.8"

# platform
windows = "0.62"
windows-sys = "0.61"
global-hotkey = "0.8"
arboard = "3.6"
enigo = "0.6"

# tauri
tauri = { version = "2.11", features = ["tray-icon", "image-png"] }
tauri-build = "2"
tauri-plugin-autostart = "2.5"
tauri-plugin-single-instance = "2.4"
tauri-plugin-opener = "2.5"
tauri-plugin-dialog = "2.7"
tauri-plugin-log = "2.9"
tauri-plugin-os = "2.3"
tauri-plugin-clipboard-manager = "2.3"
tauri-plugin-global-shortcut = "2.3"
tauri-plugin-positioner = "2.3"
tauri-plugin-notification = "2.3"
tauri-plugin-store = "2.4"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
panic = "unwind"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2
