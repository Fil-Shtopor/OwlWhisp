[workspace]
resolver = "2"
members = [
    "crates/lw-core",
    "crates/lw-ort",
    "crates/lw-vad-silero",
    "crates/lw-engine-parakeet",
    "crates/lw-engine-whisper",
    "crates/lw-engine-sherpa",
    "crates/lw-platform",
    "crates/lw-app",
    "crates/lw-gui",
    "crates/lw-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "Apache-2.0"
repository = "https://github.com/Fil-Shtopor/OwlWhisp"
authors = ["OwlWhisp contributors"]

[workspace.dependencies]
# internal
lw-core = { path = "crates/lw-core" }
lw-ort = { path = "crates/lw-ort" }
lw-vad-silero = { path = "crates/lw-vad-silero" }
lw-engine-parakeet = { path = "crates/lw-engine-parakeet" }
lw-engine-whisper = { path = "crates/lw-engine-whisper" }
lw-engine-sherpa = { path = "crates/lw-engine-sherpa" }
lw-platform = { path = "crates/lw-platform" }
lw-app = { path = "crates/lw-app" }
lw-gui = { path = "crates/lw-gui" }

# Native GUI, replacing the Tauri webview -- see docs/architecture.md.
#
# `tiny-skia` rather than the default `wgpu` backend, for two reasons measured on the target
# machine rather than assumed. Memory: an empty window with a GPU context costs 113 MB of private
# commit (384 MB through wgpu), against 18 MB rasterising on the CPU -- the driver context is the
# whole difference, and a bare window without one is 3 MB. Consistency: a CPU rasteriser produces
# the same pixels on Windows, macOS and Linux by construction, which a platform GPU stack does not.
# `tokio` gives the executor that `Task::perform` needs: a benchmark sweep takes tens of seconds
# and must not run on the thread that draws.
iced = { version = "0.14", default-features = false, features = ["tiny-skia", "image", "lazy", "tokio"] }
# The system tray. MIT/Apache-2.0, from the Tauri authors, and the same library Tauri itself used
# for the tray in the build this replaces.
tray-icon = "0.25"
# Only to turn the embedded PNG icon into the RGBA the tray wants; already in the tree via arboard.
image = { version = "0.25", default-features = false, features = ["png"] }

# serialization / config
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "1.1"
schemars = "1.0"

# errors / logging
thiserror = "2.0"
anyhow = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
tracing-appender = "0.2"

# async / concurrency
tokio = { version = "1.53", features = ["rt-multi-thread", "sync", "time", "macros", "fs", "io-util"] }
parking_lot = "0.12"
crossbeam-channel = "0.5"
futures = "0.3"
tokio-util = { version = "0.7", features = ["rt"] }

# audio
cpal = "0.18"
rubato = "5.0"
hound = "3.5"
realfft = "3.5"
rustfft = "6.4"

# ML runtime
ort = { version = "=2.0.0-rc.13", default-features = false }
ort-sys = { version = "=2.0.0-rc.13", default-features = false }
ndarray = "0.17"
half = "2.7"
# sherpa-onnx bundles its OWN ONNX Runtime. Keep the `static` feature (the crate default) so it is
# linked into the binary instead of shipping a second `onnxruntime.dll` that would collide with the
# one `lw-ort` loads dynamically by full path. See crates/lw-engine-sherpa/README.md.
sherpa-onnx = { version = "1.13.6", default-features = false, features = ["static"] }

# networking / hashing / files
# `native-tls` spelled out rather than `default-tls`: as of reqwest 0.13 that alias means
# *rustls*, so leaving it would have quietly moved every model download onto a different TLS
# stack with a different trust store -- and onto `aws-lc-sys`, which does not build for
# Windows ARM64 without clang-cl. The platform's own TLS and certificate store is what this
# has always used.
reqwest = { version = "0.13", default-features = false, features = ["native-tls", "stream", "json", "charset", "http2", "blocking"] }
sha2 = "0.11"
hex = "0.4"
libloading = "0.8.9"
directories = "6.0"
tempfile = "3"
walkdir = "2"
zip = { version = "8.6", default-features = false, features = ["deflate"] }
tar = "0.4"
bzip2 = "0.6"
flate2 = "1.1"

# misc
regex = "1.13"
unicode-normalization = "0.1"
semver = { version = "1.0", features = ["serde"] }
uuid = { version = "1.25", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
once_cell = "1"
sysinfo = "0.39"
keyring = { version = "4.1", features = ["windows-native-keyring-store", "apple-native-keyring-store", "linux-keyutils-keyring-store"] }
clap = { version = "4.6", features = ["derive"] }
indicatif = "0.18"

# platform
windows = "0.62"
windows-sys = "0.61"
global-hotkey = "0.8"
arboard = "3.6"
enigo = "0.6"


[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
panic = "unwind"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2
