[package]
name = "localwisper"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "LocalWisper desktop shell: Tauri 2 tray app, overlay, settings and diagnostics UI"

[lib]
name = "localwisper_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { workspace = true }

[features]
# Tauri decides dev-vs-production by this feature: with `custom-protocol` OFF it loads the frontend
# from `build.devUrl` (the Vite dev server); with it ON it serves the assets embedded from
# `build.frontendDist`. The Tauri CLI passes it automatically on `tauri build`; a plain
# `cargo build --release` must pass `--features custom-protocol` or the window shows
# "localhost refused to connect".
default = []
custom-protocol = ["tauri/custom-protocol"]
# Portable CPU engine (Whisper / Moonshine / SenseVoice and friends). Off by default: see
# docs/licenses.md - the stock sherpa-onnx archive links GPL-3.0 espeak-ng, which cannot be
# combined with the proprietary Qualcomm runtime, so a shipped build needs a -no-tts archive.
sherpa = ["lw-engine-sherpa/sherpa"]

[dependencies]
# workspace crates
lw-core.workspace = true
lw-ort.workspace = true
lw-engine-parakeet.workspace = true
lw-platform.workspace = true
lw-engine-sherpa.workspace = true
crossbeam-channel.workspace = true

# tauri + plugins (single-instance must be *registered* first at runtime; order here is cosmetic)
tauri = { workspace = true }
tauri-plugin-single-instance.workspace = true
tauri-plugin-global-shortcut.workspace = true
tauri-plugin-clipboard-manager.workspace = true
tauri-plugin-autostart.workspace = true
tauri-plugin-opener.workspace = true
tauri-plugin-dialog.workspace = true
tauri-plugin-os.workspace = true
tauri-plugin-notification.workspace = true
tauri-plugin-positioner.workspace = true
tauri-plugin-log.workspace = true
tauri-plugin-store.workspace = true

# support
serde.workspace = true
serde_json.workspace = true
parking_lot.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
tracing-appender.workspace = true
log = "0.4"
